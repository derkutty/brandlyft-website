<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connecting account · Brandlyft</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
<header class="top"><a class="logo" href="/"><img src="/logo.svg" alt="" width="30" height="30">Brandlyft</a></header>
<main class="legal">
<h1>Connecting your account</h1>
<p id="status">Brandlyft is finishing the connection to your Facebook and Instagram account…</p>
<p><a href="/app/">Back to Brandlyft</a> · Questions? <a href="mailto:hello@brandlyft.app">hello@brandlyft.app</a></p>
</main>
</div>
<script src="/app/config.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), status = document.getElementById("status");
  // Remove the code from the address bar right away
  history.replaceState(null, "", location.pathname);
  if (q.get("error") || !q.get("code")) {
    status.textContent = "The connection was cancelled or failed" + (q.get("error_description") ? " (" + q.get("error_description") + ")" : "") + ". You can go back and try again.";
    return;
  }
  fetch(window.BRANDLYFT_API + "/api/auth/meta/finish", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code: q.get("code"), state: q.get("state") })
  }).then(function (r) {
    return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || d.detail || "Connection failed"); return d; });
  }).then(function (d) {
    try { localStorage.setItem("bl_session", d.session); } catch (e) {}
    status.textContent = "Connected. Taking you to Brandlyft…";
    location.replace("/app/");
  }).catch(function (e) { status.textContent = e.message; });
})();
</script>
</body>
</html>
